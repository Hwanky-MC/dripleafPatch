plugins {
    id 'java'
}

group = 'com.hwanky'
version = '1.0.0'
description = 'Super lightweight, zero-TPS impact patch for Small Dripleaf captureTreeGeneration dupe and Shulker Box nesting exploits on Paper, Purpur, and Leaf 1.21+.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    // PaperMC Official Maven Repository
    maven {
        name = "papermc"
        url = uri("https://repo.papermc.io/repository/maven-public/")
    }
    // Sonatype repository
    maven {
        name = "sonatype"
        url = uri("https://oss.sonatype.org/content/groups/public/")
    }
}

dependencies {
    // Paper API for Paper, Purpur, and Leaf 1.21.4+
    compileOnly("io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

jar {
    archiveBaseName.set('DripleafPatch')
    archiveClassifier.set('')
    archiveVersion.set(project.version.toString())
}